<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Baker's Peek-a-Boo" />
  <title>Baker's Peek-a-Boo World</title>
  <meta name="theme-color" content="#E8DFF5" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23FDE8E4'/%3E%3Ccircle cx='50' cy='46' r='24' fill='%23FDDCCA'/%3E%3Cellipse cx='50' cy='26' rx='22' ry='10' fill='%23C8704A'/%3E%3Ccircle cx='41' cy='46' r='6' fill='white'/%3E%3Ccircle cx='59' cy='46' r='6' fill='white'/%3E%3Ccircle cx='42' cy='46' r='3' fill='%234A4458'/%3E%3Ccircle cx='60' cy='46' r='3' fill='%234A4458'/%3E%3Cpath d='M44 58 Q50 63 56 58' stroke='%23E0988C' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Soft modern baby palette */
      --cream: #FFF8F0;
      --warm-white: #FFFDF9;
      --blush: #F8D0C8;
      --blush-light: #FDE8E4;
      --peach: #FDDCB5;
      --peach-soft: #FEF0E0;
      --sage: #B8D8BA;
      --sage-deep: #8BBF8E;
      --sage-light: #DFF0DF;
      --lavender: #C9B8E8;
      --lavender-light: #E8DFF5;
      --sky: #BDD8F1;
      --sky-light: #DBE9F7;
      --sky-deep: #A3C4E0;
      --buttercup: #F5E6A3;
      --buttercup-deep: #E8D57A;
      --coral: #F0A08C;
      --coral-deep: #E88B73;
      --text-dark: #4A4458;
      --text-medium: #7A7490;
      --text-light: #A8A2B8;
      --shadow-soft: rgba(74, 68, 88, 0.06);
      --shadow-medium: rgba(74, 68, 88, 0.1);
      --card-bg: rgba(255, 255, 255, 0.65);
      --card-border: rgba(255, 255, 255, 0.8);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100%; height: 100%; overflow: hidden;
      touch-action: manipulation; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    body {
      overscroll-behavior: none; position: fixed; inset: 0;
      font-family: 'Fredoka', 'Quicksand', system-ui, sans-serif;
    }

    @keyframes gentle-wiggle {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-2.5deg) scale(1.015); }
      40% { transform: rotate(2.5deg) scale(1.015); }
      60% { transform: rotate(-1.5deg); }
      80% { transform: rotate(1.5deg); }
    }
    @keyframes animal-pop {
      0% { transform: scale(0) rotate(-8deg); opacity: 0; }
      60% { transform: scale(1.1) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes animal-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes sparkle-fly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.88; }
    }
    @keyframes drift {
      0%, 100% { transform: translateX(0) translateY(0); }
      33% { transform: translateX(8px) translateY(-3px); }
      66% { transform: translateX(-4px) translateY(2px); }
    }
    @keyframes toast-in {
      0% { transform: translateX(-50%) translateY(16px) scale(0.9); opacity: 0; }
      100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
    }
    @keyframes toast-out {
      0% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
      100% { transform: translateX(-50%) translateY(-16px) scale(0.9); opacity: 0; }
    }
    @keyframes star-twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }
    @keyframes cloud-drift-slow {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(15px); }
    }
    @keyframes cloud-drift-slower {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-10px); }
    }
    @keyframes welcome-baby-float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes card-idle-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.008); }
    }
    @keyframes celebration-glow {
      0%, 100% { box-shadow: 0 0 40px rgba(248, 208, 200, 0.3); }
      50% { box-shadow: 0 0 80px rgba(248, 208, 200, 0.6); }
    }
    @keyframes soft-confetti-fall {
      0% { transform: translateY(-10px) rotate(0deg) scale(1); opacity: 1; }
      70% { opacity: 0.8; }
      100% { transform: translateY(100vh) rotate(540deg) scale(0.5); opacity: 0; }
    }
    @keyframes badge-pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* ===== BOARD LAYOUT =====
       The board keeps a 2x3 shape in portrait and turns into 3x2 in landscape,
       sized to whatever room is left between the top bar and the found bar, so
       nothing gets clipped on a short screen and nothing floats in a sea of
       empty card on a tablet. Card art scales with the card (cqmin units). */
    .grid-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px 14px 6px; position: relative; z-index: 1; }
    .grid { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); grid-template-rows: repeat(var(--rows, 3), 1fr); gap: 8px; height: 100%; max-width: 100%; aspect-ratio: var(--cols, 2) / var(--rows, 3); }
    @media (orientation: landscape) {
      .grid { grid-template-columns: repeat(var(--rows, 3), 1fr); grid-template-rows: repeat(var(--cols, 2), 1fr); aspect-ratio: var(--rows, 3) / var(--cols, 2); }
    }
    /* prompt strip: what to do this round, tappable to hear it again */
    .prompt { display: flex; justify-content: center; padding: 0 14px 6px; flex-shrink: 0; position: relative; z-index: 5; }
    .prompt-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.85); border-radius: 24px; padding: 6px 16px; font-family: inherit; font-size: clamp(13px, 3.2vw, 16px); font-weight: 600; color: var(--text-dark); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 2px 8px rgba(74,68,88,0.05); cursor: pointer; max-width: 100%; animation: pulse-soft 2.5s ease-in-out infinite; text-align: left; }
    .prompt-q { font-size: 26px; font-weight: 700; color: var(--coral-deep); width: 30px; text-align: center; }
    .prompt-letter { font-size: 28px; font-weight: 700; color: var(--coral-deep); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--blush-light); border-radius: 12px; flex-shrink: 0; }
    .bins { display: flex; gap: 10px; }
    .bin { display: flex; flex-direction: column; align-items: center; gap: 2px; background: rgba(255,255,255,0.75); border: 2px dashed rgba(74,68,88,0.15); border-radius: 18px; padding: 6px 14px; min-width: 112px; font-family: inherit; cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease; touch-action: manipulation; }
    .bin.is-armed { border-color: var(--coral); border-style: solid; }
    .bin.is-hover { transform: scale(1.06); background: var(--blush-light); border-color: var(--coral); border-style: solid; }
    .bin-art { width: 56px; height: 42px; display: flex; }
    .bin-art svg { width: 100%; height: 100%; }
    .bin-label { font-size: 12px; font-weight: 600; color: var(--text-medium); }
    .bin-count { display: flex; gap: 2px; font-size: 14px; min-height: 18px; }
    .spot-check { position: absolute; top: 7%; right: 7%; width: 24px; height: 24px; border-radius: 50%; background: var(--sage-deep); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; z-index: 3; animation: badge-pop 0.4s cubic-bezier(0.68,-0.55,0.265,1.55) both; }
    .spot-numeral { font-size: clamp(40px, 46cqmin, 110px); font-weight: 700; color: var(--coral-deep); line-height: 1; }
    .spot-btn.is-selected { box-shadow: inset 0 0 0 4px var(--coral); border-radius: 20px; }
    .spot-btn.is-dragging .spot-reveal { opacity: 0.3; }
    .spot-wrap.is-sorted { opacity: 0.35; transition: opacity 0.4s ease; }
    .drag-ghost { position: fixed; width: 110px; height: 110px; transform: translate(-50%, -60%) scale(1.1); pointer-events: none; z-index: 400; filter: drop-shadow(0 8px 16px rgba(74,68,88,0.25)); }
    .drag-ghost svg { width: 100%; height: 100%; }
    .spot-wrap { position: relative; min-width: 0; min-height: 0; container-type: size; background: rgba(255,255,255,0.45); border-radius: 20px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 2px 12px rgba(74,68,88,0.04), inset 0 1px 0 rgba(255,255,255,0.6); overflow: hidden; }
    .spot-btn { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: transparent; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; display: flex; align-items: center; justify-content: center; touch-action: manipulation; font-family: inherit; color: inherit; }
    .spot-btn:focus-visible { box-shadow: inset 0 0 0 3px var(--coral); border-radius: 20px; }
    .spot-cover { position: absolute; width: 78%; height: 66%; display: flex; align-items: center; justify-content: center; z-index: 1; transition: transform 0.5s cubic-bezier(0.68,-0.55,0.265,1.55), opacity 0.5s ease, filter 0.5s ease; }
    .spot-cover.is-revealed { transform: scale(0.3) translateY(-40px); opacity: 0.2; filter: blur(3px); }
    .spot-cover > svg { width: 100%; height: 100%; }
    .spot-reveal { position: relative; z-index: 2; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; animation: animal-pop 0.5s cubic-bezier(0.68,-0.55,0.265,1.55) both; }
    .spot-art { width: 72%; height: 54%; display: flex; align-items: center; justify-content: center; animation: animal-bounce 1.5s ease-in-out 0.5s infinite; }
    .spot-art > svg { width: 100%; height: 100%; }
    .spot-label { font-weight: 600; font-size: clamp(11px, 7cqmin, 15px); color: var(--text-dark); background: rgba(255,248,240,0.9); border-radius: 14px; padding: 3px 12px; animation: fade-in 0.3s 0.3s both; box-shadow: 0 2px 8px rgba(74,68,88,0.06); white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
    .spot-count { font-weight: 700; font-size: clamp(18px, 12cqmin, 26px); color: var(--coral-deep); background: rgba(255,255,255,0.88); border-radius: 50%; width: clamp(34px, 22cqmin, 46px); height: clamp(34px, 22cqmin, 46px); display: flex; align-items: center; justify-content: center; animation: fade-in 0.3s 0.3s both; box-shadow: 0 2px 8px rgba(74,68,88,0.08); }
    .spot-empty { position: relative; z-index: 2; font-size: clamp(22px, 14cqmin, 36px); color: var(--text-light); animation: fade-in 0.3s both; }
    /* the friend peeking out from behind the cover during an idle nudge */
    .spot-peek { position: absolute; left: 50%; top: 50%; width: 46%; height: 42%; z-index: 0; pointer-events: none; animation: peek-out 1.9s ease-in-out both; }
    .spot-peek > svg { width: 100%; height: 100%; }
    @keyframes peek-out {
      0% { transform: translate(-50%, -10%); opacity: 0; }
      30%, 70% { transform: translate(-50%, -96%); opacity: 1; }
      100% { transform: translate(-50%, -10%); opacity: 0; }
    }
    @keyframes card-nudge {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.06) rotate(-4deg); }
      50% { transform: scale(1.06) rotate(4deg); }
      75% { transform: scale(1.03) rotate(-2deg); }
    }
    /* grown-up gate: the ring that fills while the gear is held */
    .gate-ring { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px); pointer-events: none; }
    @keyframes gate-fill { from { stroke-dashoffset: 110; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.15s !important; }
    }
  </style>
